# Log con tiempos para el API del POS: request_time (lo que espero el
# cliente, incluye la red) y upstream_response_time (lo que tardo Laravel).
# Sin esto no habia forma de separar lentitud de red de lentitud del API.
log_format timed '$remote_addr [$time_local] "$request" $status $body_bytes_sent rt=$request_time urt=$upstream_response_time "$http_user_agent"';
