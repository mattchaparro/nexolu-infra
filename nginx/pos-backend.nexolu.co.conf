# nexolu-pos-api (Laravel) -> contenedor pos-web, puerto 8001 en localhost.
#
# Plantilla para /etc/nginx/sites-available/ en el HOST (no en un
# contenedor) - certbot corre en modo `--nginx` y edita este archivo solo
# para agregar el bloque 443 + certificados. Ver README.md paso 5.
server {
    listen 80;
    server_name pos-backend.nexolu.co;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
