# nexolu-pos-api (Laravel) -> contenedor pos-web, puerto 8001 en localhost.
#
# Plantilla para /etc/nginx/sites-available/ en el HOST (no en un
# contenedor) - certbot corre en modo `--nginx` y edita este archivo solo
# para agregar el bloque 443 + certificados. Ver README.md paso 5.
server {
    server_name pos-backend.nexolu.co;

    client_max_body_size 20M;
    access_log /var/log/nginx/pos-backend.timed.log timed;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sin esto nginx retiene toda la respuesta antes de reenviarla y el
        # streaming SSE de /v1/ai/chat/stream llega al navegador de un solo
        # golpe (o no llega). El fastcgi_buffering off del contenedor no
        # alcanza: ese aplica al nginx interno -> PHP-FPM, este es el proxy
        # de afuera. read_timeout acompana al de 120s de AiChatService.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pos-backend.nexolu.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pos-backend.nexolu.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = pos-backend.nexolu.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name pos-backend.nexolu.co;
    return 404; # managed by Certbot


}