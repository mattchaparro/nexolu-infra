# SGA -- el sistema del colegio. DOS contenedores detras de un solo dominio:
#
#   /api, /storage  -> sga-api   (Laravel, 127.0.0.1:8050)
#   todo lo demas   -> sga-front (el SPA compilado, 127.0.0.1:8051)
#
# Un solo origen a proposito: asi el navegador no ve una peticion cruzada y no
# hay CORS que configurar en ningun lado. Es el mismo reparto que hace el
# proxy de Vite en desarrollo, para que lo que se prueba en local sea lo que
# corre en produccion.
server {
    listen 80;
    server_name sga.nexolu.co;

    # El escudo y las firmas se validan en 1 MB; 8M deja aire para el
    # multipart y coincide con el limite del PHP del contenedor.
    client_max_body_size 8M;

    location /api {
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Los boletines de un curso entero son treinta PDF en una sola
        # peticion: con los 60s por defecto, secretaria recibe un 504 a mitad
        # de la descarga.
        proxy_read_timeout 180s;
    }

    # Lo que el colegio sube: el escudo, las firmas, las imagenes del muro.
    location /storage {
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8051;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
