# nexolu-comms-front (Nexolú Connect, Vue SPA) -> servido directo por el
# nginx de nexolu-core, sin contenedor propio. Mismo patron que
# tienda.nexolu.co.conf / new-pos.nexolu.co.conf: build en contenedor
# efimero, archivos servidos desde el host, `current` es un symlink que
# deploy.sh mueve de golpe (ver nexolu-comms-front/deploy.sh).
#
# Vive en el MISMO droplet que comms.nexolu.co a proposito: es el panel de
# esa API (y de nadie mas), asi que caen y se levantan juntos. El acceso
# cross-origin del navegador lo autoriza comms-api via PANEL_CORS_ORIGINS
# (debe incluir https://connect.nexolu.co).
#
# Copia canonica en nexolu-infra/nginx/connect.nexolu.co.conf.

server {
    server_name connect.nexolu.co;

    root /opt/nexolu/nexolu-comms-front/current;
    index index.html;

    # Quien puede meter este panel en un iframe. Por defecto NADIE: dejar
    # que cualquier sitio te embeba es como se roban sesiones a punta de
    # clics sobre un iframe invisible.
    #
    # La excepcion es la bandeja embebida (/embebido/chat): el panel del
    # Spa muestra el chat de Connect adentro para no tener que escribirlo
    # dos veces. Por eso va el dominio del Spa y ninguno mas.
    add_header Content-Security-Policy "frame-ancestors 'self' https://agenda.nexolu.co" always;

    # index.html NUNCA se cachea: es lo unico que referencia los nombres
    # hasheados de los assets. Si un cliente lo cachea, sigue pidiendo
    # assets de una release que ya se borro.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        # Repetida a proposito: un `add_header` dentro de un location anula
        # TODOS los del server, asi que la cabecera de arriba no llega aca
        # -- y aca es justo donde se sirve la pagina que se embebe.
        add_header Content-Security-Policy "frame-ancestors 'self' https://agenda.nexolu.co" always;
        try_files $uri =404;
    }

    # Assets con hash en el nombre: inmutables, cache agresiva. El fallback
    # a la release anterior cubre la pestana que ya estaba abierta cuando
    # se desplego y sigue pidiendo chunks viejos.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @release_anterior;
    }

    location @release_anterior {
        root /opt/nexolu/nexolu-comms-front/previous;
        try_files $uri =404;
    }

    # SPA: cualquier ruta que no sea un archivo cae en index.html y la
    # resuelve Vue Router (/flujos, /canales, /usuarios...). Ademas es la
    # puerta del SSO: nexolu-auth devuelve a una URL con fragmento que el
    # front recoge - un 404 aqui rompe el login.
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/connect.nexolu.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/connect.nexolu.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = connect.nexolu.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name connect.nexolu.co;
    return 404; # managed by Certbot
}
