# luxurynails.com.co: copia ESTATICA de las paginas publicas de la app vieja
# (blue-souls-app), capturada el 2026-10-15. El diseno es el mismo, pero ya
# no hay Laravel detras: agendar y entrar viven en la agenda (agenda.nexolu.co).
#
# Es una app Inertia: un clic en un enlace no pide HTML sino JSON con el
# header X-Inertia. Por eso cada pagina se guardo dos veces: site/<ruta>/index.html
# para la carga normal y _inertia/<ruta>.json para la navegacion interna.
# Los precios y servicios quedan congelados a esa fecha.
server {
    server_name luxurynails.com.co www.luxurynails.com.co;
    root /var/www/luxurynails-estatico/site;
    index index.html;

    set $agenda_reservar https://agenda.nexolu.co/reservar/luxury-nails;
    set $agenda_entrar https://agenda.nexolu.co/iniciar-sesion;

    # Inertia no sigue un 302 a otro dominio: pide 409 + X-Inertia-Location.
    location = /agendar {
        if ($http_x_inertia) {
            add_header X-Inertia-Location $agenda_reservar always;
            return 409;
        }
        return 302 $agenda_reservar;
    }

    location ~ ^/(login|register|forgot-password|reset-password|dashboard|admin|owner|employee|client|user)(/|$) {
        if ($http_x_inertia) {
            add_header X-Inertia-Location $agenda_entrar always;
            return 409;
        }
        return 302 $agenda_entrar;
    }

    location = /servicios/api {
        default_type application/json;
        try_files /servicios/api.json =404;
    }

    location / {
        error_page 418 = @inertia;
        if ($http_x_inertia) {
            return 418;
        }
        try_files $uri $uri/index.html =404;
    }

    location @inertia {
        root /var/www/luxurynails-estatico/_inertia;
        default_type application/json;
        add_header X-Inertia true always;
        add_header Vary X-Inertia always;
        try_files $uri.json =404;  # la home se guardo como .json ($uri es "/")
    }

    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 = @inicio;
    location @inicio {
        return 302 /;
    }

    listen 443 ssl;
    ssl_certificate /etc/nginx/certs-temporales/luxurynails.com.co/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs-temporales/luxurynails.com.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name luxurynails.com.co www.luxurynails.com.co;
    return 301 https://$host$request_uri;
}
