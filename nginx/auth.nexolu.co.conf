# nexolu-auth (FastAPI) -> contenedor auth, puerto 8030 en localhost.
#
# 1M y no 10M como los demas: aca solo entran un formulario de login y
# aserciones JWT de un par de KB. No hay razon para aceptar cuerpos grandes
# en la puerta de entrada de la identidad.
server {
    listen 80;
    server_name auth.nexolu.co;

    client_max_body_size 1M;

    location / {
        proxy_pass http://127.0.0.1:8030;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # El servicio lee de aca la IP real para el limite de intentos de
        # login (ver client_ip() en nexolu_auth/api/sso.py) - sin este
        # header contaria todos los intentos como si vinieran del proxy.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
