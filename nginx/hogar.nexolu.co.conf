# hogar-app (FastAPI + la pantalla) -> contenedor hogar, puerto 8040
# en localhost. A diferencia de los otros vhosts, este sirve ademas HTML/CSS/JS
# desde el mismo proceso (hogar_app/web/), no solo JSON.
server {
    listen 80;
    server_name hogar.nexolu.co;

    client_max_body_size 2M;

    location / {
        proxy_pass http://127.0.0.1:8040;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
