# nexolu-store-front (tienda online publica, Vue SPA) -> servido directo por
# este nginx, sin contenedor propio. Mismo patron que new-pos.nexolu.co.conf:
# build en contenedor efimero, archivos servidos desde el host, `current` es
# un symlink que deploy.sh mueve de golpe (ver nexolu-store-front/deploy.sh).
#
# Un dominio para TODAS las tiendas, cada comercio en su path
# (tienda.nexolu.co/{slug}). Un solo certificado y un solo vhost. La
# alternativa - {slug}.tienda.nexolu.co - obliga a DNS wildcard y a migrar
# certbot a DNS-01 con certbot-dns-digitalocean; queda para cuando haga
# falta, no para el arranque.
#
# Diferencia real con el vhost del POS: aca el visitante es un comprador
# anonimo que llega de Google o de un link de WhatsApp. No tiene sesion, no
# sabe que es una SPA y no va a reintentar. Por eso importan tanto el
# fallback de assets a la release anterior como que index.html no se cachee.

server {
    server_name tienda.nexolu.co;

    root /opt/nexolu/nexolu-store-front/current;
    index index.html;

    # index.html NUNCA se cachea: es lo unico que referencia los nombres
    # hasheados de los assets. Si un cliente lo cachea, sigue pidiendo
    # assets de una release que ya se borro.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # Los assets llevan hash en el nombre: inmutables, cache agresiva. El
    # fallback a la release anterior cubre la pestana que ya estaba abierta
    # cuando se desplego y sigue pidiendo chunks viejos.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @release_anterior;
    }

    location @release_anterior {
        root /opt/nexolu/nexolu-store-front/previous;
        try_files $uri =404;
    }

    # SPA: cualquier ruta que no sea un archivo cae en index.html y la
    # resuelve Vue Router (/{slug}, /{slug}/producto/{id}, /{slug}/carrito,
    # /{slug}/pedido/{token}). Sin esto, entrar directo a una ficha de
    # producto - que es como llega la gente desde WhatsApp - da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SEO: la SPA no se prerenderiza todavia (limitacion conocida, ver el
    # plan del proyecto). No se pone un robots.txt restrictivo aca a
    # proposito - que Google indexe lo que pueda es mejor que nada, y
    # bloquearlo ahora seria mas dificil de revertir que agregarlo despues.

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tienda.nexolu.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tienda.nexolu.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = tienda.nexolu.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name tienda.nexolu.co;
    return 404; # managed by Certbot
}
