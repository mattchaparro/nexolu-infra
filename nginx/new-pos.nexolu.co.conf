# nexolu-pos-front (Vue SPA, build estatico) -> servido directo por este
# nginx, sin contenedor propio. El build corre en un contenedor efimero pero
# lo que se sirve son archivos del host (ver nexolu-pos-front/deploy.sh y
# docs/DEPLOY_POS_FRONT.md).
#
# root apunta a `current`, un SYMLINK que deploy.sh mueve de golpe al
# terminar cada build. Antes apuntaba directo a dist/, que era el mismo
# directorio donde el build escribia: durante el build el cliente recibia
# una app a medias. Con el symlink, nginx resuelve el root en cada request,
# asi que el cambio de version es instantaneo y nadie ve un estado
# intermedio - no hace falta reload de nginx ni ventana de mantenimiento.
#
# try_files con fallback a index.html porque es una SPA con rutas de cliente
# (Vue Router, paths en espanol) - sin esto, refrescar en /iniciar-sesion
# da 404.

server {
    server_name new-pos.nexolu.co;

    root /opt/nexolu/nexolu-pos-front/current;
    index index.html;

    # index.html NUNCA se cachea: es lo unico que referencia los nombres
    # hasheados de los assets. Si un cliente lo cachea, sigue pidiendo
    # assets de una release que ya se borro.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # Los assets llevan hash en el nombre, asi que son inmutables y se
    # pueden cachear agresivamente.
    #
    # El fallback a la release ANTERIOR cubre la ventana real de un deploy:
    # un cliente que ya tenia la pagina abierta sigue con el index.html
    # viejo en memoria y va a pedir assets que en `current` ya no existen.
    # Sin este fallback, esa pestana se rompe (chunk 404) hasta recargar -
    # que es justo el "no le bloqueemos la app al cliente" que este esquema
    # busca. deploy.sh mantiene `previous` apuntando a la release anterior.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @release_anterior;
    }

    location @release_anterior {
        root /opt/nexolu/nexolu-pos-front/previous;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pos-backend.nexolu.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pos-backend.nexolu.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = new-pos.nexolu.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name new-pos.nexolu.co;
    return 404; # managed by Certbot
}
