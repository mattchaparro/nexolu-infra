# nexolu-pos-front (Vue SPA, build estatico) -> servido directo por este
# nginx, sin contenedor propio (el repo todavia no tiene Dockerfile - ver
# README.md). `npm run build` corre en el droplet, este vhost sirve
# /opt/nexolu/nexolu-pos-front/dist. try_files con fallback a index.html
# porque es una SPA con rutas de cliente (Vue Router, ver CLAUDE.md del
# repo: paths en espanol) - sin esto, refrescar en /iniciar-sesion da 404.
server {
    listen 80;
    server_name new-pos.nexolu.co;

    root /opt/nexolu/nexolu-pos-front/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
