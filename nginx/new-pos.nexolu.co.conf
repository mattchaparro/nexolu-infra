# new-pos.nexolu.co quedo como alias viejo: redirige al dominio definitivo.
server {
    server_name new-pos.nexolu.co;
    return 308 https://pos.nexolu.co$request_uri;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/pos-backend.nexolu.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos-backend.nexolu.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name new-pos.nexolu.co;
    return 308 https://pos.nexolu.co$request_uri;
}
