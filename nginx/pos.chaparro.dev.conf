# pos.chaparro.dev: dominio viejo del POS legacy (el droplet que lo servia se
# destruyo el 16-oct-2026). Google lo sigue mostrando como "Nexolu POS", asi
# que se redirige TODO con 301: Google cambia el resultado por la URL nueva y
# deja de mostrar este dominio. No se sirve contenido ni robots.txt propio,
# para que el rastreador siempre vea la redireccion.
#
#   /                      -> https://nexolu.co/pos/   (el home del POS)
#   /login, /register...   -> las rutas de la app nueva en pos.nexolu.co
#   legales                -> los de nexolu.co
#   cualquier otra ruta    -> https://pos.nexolu.co/   (la app)
#
# Requiere que el registro A de pos.chaparro.dev (DNS en Hostinger) apunte a
# este droplet, 174.138.42.118. El certificado temporal vence el 29-nov-2026:
# con el DNS ya apuntando aqui, correr certbot --nginx -d pos.chaparro.dev.

server {
    listen 80;
    server_name pos.chaparro.dev;
    return 301 https://pos.chaparro.dev$request_uri;
}

server {
    listen 443 ssl;
    server_name pos.chaparro.dev;

    ssl_certificate /etc/nginx/certs-temporales/pos.chaparro.dev/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs-temporales/pos.chaparro.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location = /                 { return 301 https://nexolu.co/pos/; }
    location = /login            { return 301 https://pos.nexolu.co/iniciar-sesion; }
    location = /register         { return 301 https://pos.nexolu.co/registro; }
    location = /forgot-password  { return 301 https://pos.nexolu.co/olvide-mi-contrasena; }
    location = /privacy-policy   { return 301 https://nexolu.co/privacidad/; }
    location = /terms-of-service { return 301 https://nexolu.co/terminos/; }
    location /                   { return 301 https://pos.nexolu.co/; }
}
