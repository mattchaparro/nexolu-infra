# Compresion de respuestas de texto, para /etc/nginx/conf.d/ (aplica a todos
# los sitios del droplet).
#
# nginx.conf de Ubuntu trae `gzip on` pero con `gzip_types` comentado, y el
# default de esa directiva es solo text/html. Resultado: todo lo demas
# viajaba sin comprimir. Medido en el POS el 21-oct-2026, con el reporte de
# "la app esta muy lenta" de Central Cell:
#   - bundle del front: 3.9 MB de JS
#   - catalogo de Vender (956 productos): 558 KB de JSON por carga
# Son tablets de mostrador con red movil; gzip baja eso entre 70% y 80%.
gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

# El API se sirve por proxy_pass: sin `gzip_proxied any` nginx no comprime lo
# que viene de un upstream, que es justo el JSON mas pesado.
gzip_proxied any;

# Avisa a los caches intermedios que la respuesta cambia segun Accept-Encoding.
gzip_vary on;

# 5 de 9: casi toda la ganancia con bastante menos CPU que 9, en un droplet
# compartido con MySQL y PHP.
gzip_comp_level 5;

# Por debajo de 1 KB comprimir cuesta mas de lo que ahorra.
gzip_min_length 1024;
